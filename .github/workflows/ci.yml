permissions:
    contents: read

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoreboard-api
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scoreboard-api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
    
  build-and-push:
    permissions:
      contents: write
      packages: write
    name: Build 
    needs: test
    runs-on: ubuntu-latest
    steps:
        - name: Check out code
          uses: actions/checkout@v7

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
              
        - name: Build
          uses: docker/build-push-action@v7
          with:
            context: scoreboard-api
            push: false 
