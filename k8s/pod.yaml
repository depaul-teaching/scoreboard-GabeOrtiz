apiVersion: v1
kind: Pod
metadata:
  name: scoreboard
  labels:
    app: scoreboard
spec:
  containers:
    - name: scoreboard-api
      image: ghcr.io/depaul-teaching/scoreboard-gabeortiz/scoreboard-api:latest
      ports:
        - containerPort: 8000
      env:
        - name: FAVORITE_TEAM
          value: "cubs"